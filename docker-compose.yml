# SADECE YEREL LAB İÇİNDİR. Güvenlik (xpack.security) kapalıdır; internete açmayın.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: lab-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: lab-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: lab-logstash
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.monitoring.enabled=false
    ports:
      - "127.0.0.1:5044:5044"   # Winlogbeat (Sysmon) buraya bağlanır
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./sample_data:/data:ro
    depends_on:
      - elasticsearch

volumes:
  esdata:
